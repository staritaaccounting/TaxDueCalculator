<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tax Calculator</title>
<meta name="theme-color" content="#0A2E5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tax Calculator">
<meta name="description" content="Tax Calculator — BIR tax compliance calculator and filing assistant.">
<style>
  :root{
    --navy:#0d2b52; --blue:#1e6fd9; --gold:#f5a800; --gold2:#ffc940; --bg:#f4f7fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}

  /* ---------- app frame (keeps the GitHub Pages URL in the address bar) ---------- */
  #app{
    position:fixed;inset:0;width:100%;height:100%;border:0;display:block;
    padding-top:env(safe-area-inset-top);
    background:var(--bg);
  }

  /* ---------- splash ---------- */
  #splash{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(circle at 50% 38%, #ffffff 0%, #e9eff8 65%, #dde8f6 100%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
  .logo-wrap{position:relative;width:196px;height:196px;display:flex;align-items:center;justify-content:center}
  .logo-wrap img{width:140px;height:140px;border-radius:50%;box-shadow:0 4px 30px rgba(13,43,82,.25);
    position:relative;z-index:2;object-fit:cover;background:#fff}
  .ring{position:absolute;border-radius:50%;border:2.5px solid transparent}
  .r1{width:196px;height:196px;border-top-color:var(--blue);border-right-color:var(--blue);
    animation:spin 1.6s linear infinite;filter:drop-shadow(0 0 8px rgba(30,111,217,.5))}
  .r2{width:156px;height:156px;border-bottom-color:var(--gold);border-left-color:var(--gold);
    animation:spin 2.2s linear infinite reverse;filter:drop-shadow(0 0 6px rgba(245,168,0,.5))}
  .r3{width:116px;height:116px;border-top-color:var(--gold2);border-left-color:var(--gold2);
    animation:spin 1.1s linear infinite;filter:drop-shadow(0 0 4px rgba(255,201,64,.5))}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--navy);font-weight:800;font-size:21px;letter-spacing:.5px;text-align:center}
  .brand span{color:var(--blue)}
  .tagline{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#8a97a8;font-size:11.5px;letter-spacing:3px;text-transform:uppercase;margin-top:-14px}
  .retry{margin-top:6px;display:none;font-family:-apple-system,sans-serif}
  .retry a{color:var(--blue);font-size:13px;text-decoration:underline;cursor:pointer}

  /* ---------- install banner ---------- */
  #installBanner{
    position:fixed;left:12px;right:12px;bottom:-160px;z-index:30;
    background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(13,43,82,.28);
    padding:14px 16px;display:flex;align-items:center;gap:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    transition:bottom .4s cubic-bezier(.2,.8,.2,1);max-width:420px;margin:0 auto;
  }
  #installBanner.show{bottom:calc(16px + env(safe-area-inset-bottom))}
  #installBanner img{width:44px;height:44px;border-radius:11px;flex-shrink:0;object-fit:cover}
  #installBanner .ib-text{flex:1;min-width:0}
  #installBanner .ib-title{font-weight:700;font-size:14px;color:var(--navy);margin-bottom:2px}
  #installBanner .ib-sub{font-size:12px;color:#6b7686;line-height:1.35}
  #installBanner .ib-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex-shrink:0}
  #installBanner button{border:0;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;font-family:inherit}
  #installBanner .ib-install{background:var(--blue);color:#fff}
  #installBanner .ib-install:active{background:#1859ab}
  #installBanner .ib-dismiss{background:transparent;color:#9aa4b2;padding:4px 6px}
  @media (prefers-color-scheme: dark){
    #installBanner{background:#151b24}
    #installBanner .ib-title{color:#fff}
    #installBanner .ib-sub{color:#9aa4b2}
  }
</style>
</head>
<body>
  <iframe id="app" title="Tax Calculator"
          allow="clipboard-read; clipboard-write; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="splash">
    <div class="logo-wrap">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <img src="icon.png" alt="Tax Calculator logo">
    </div>
    <div class="brand"><span>Tax</span> Calculator</div>
    <div class="tagline" id="tagline">Loading</div>
    <div class="retry" id="retry"><a id="retryLink">Taking too long? Tap to retry</a></div>
  </div>

  <div id="installBanner" role="dialog" aria-label="Install app">
    <img src="icon.png" alt="">
    <div class="ib-text">
      <div class="ib-title">Install Tax Calculator</div>
      <div class="ib-sub" id="ibSub">Add to your home screen for quick, full-screen access.</div>
    </div>
    <div class="ib-actions">
      <button class="ib-install" id="ibInstall">Install</button>
      <button class="ib-dismiss" id="ibDismiss">Not now</button>
    </div>
  </div>

<script>
  // ---- Apps Script web app URL ----
  // Requires doGet() to use .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
  // (see Code.gs). That lets the app load INSIDE this page, so the address bar
  // keeps showing your GitHub Pages URL instead of script.google.com.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbx2EgayzIDev9Uisfug65nCmc_XejpLoi2J3eUqtUo9npka8vhg0z1iXWFW_rs1eCfr/exec';
  var LOAD_TIMEOUT_MS = 15000;

  var frame   = document.getElementById('app');
  var splash  = document.getElementById('splash');
  var retry   = document.getElementById('retry');
  var tagline = document.getElementById('tagline');
  var loadTimer = null;

  function hideSplash(){
    clearTimeout(loadTimer);
    splash.classList.add('hide');
  }

  function load(){
    retry.style.display = 'none';
    tagline.textContent = 'Loading';
    splash.classList.remove('hide');
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function(){ retry.style.display = 'block'; }, LOAD_TIMEOUT_MS);
    // Pass through ?page=1604E&tp=...&year=... from the GitHub URL to the app,
    // so github.io/?page=1604E opens the annual forms page inside the frame.
    var qs = window.location.search.replace(/^\?/, '');
    frame.src = APP_URL + (APP_URL.indexOf('?') < 0 ? '?' : '&') +
                (qs ? qs + '&' : '') + 'r=' + Date.now();
  }

  // Optional: the app can ask the shell to switch pages without leaving github.io:
  //   window.top.postMessage({ type: 'tc-nav', query: 'page=1604E&tp=...' }, '*');
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.type !== 'tc-nav') return;
    if (!/(^|\.)google(usercontent)?\.com$/.test(new URL(e.origin).hostname)) return;
    var q = String(d.query || '').replace(/^\?/, '');
    history.pushState(null, '', q ? '?' + q : window.location.pathname);
    load();
  });
  window.addEventListener('popstate', load);

  frame.addEventListener('load', function(){
    if (frame.src) hideSplash();
  });

  function showOffline(){
    tagline.textContent = 'Offline';
    retry.style.display = 'block';
  }

  if (navigator.onLine === false) {
    showOffline();
    window.addEventListener('online', load, { once: true });
  } else {
    load();
  }

  document.getElementById('retryLink').addEventListener('click', load);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // ================================================================
  // INSTALL BANNER
  // ================================================================
  (function(){
    var DISMISS_KEY  = 'tc_install_dismissed_at';
    var DISMISS_DAYS = 14;

    var banner   = document.getElementById('installBanner');
    var subEl    = document.getElementById('ibSub');
    var installB = document.getElementById('ibInstall');
    var dismissB = document.getElementById('ibDismiss');
    var deferredPrompt = null;
    var shown = false;

    function isStandalone(){
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.navigator.standalone === true;
    }
    function recentlyDismissed(){
      try {
        var t = localStorage.getItem(DISMISS_KEY);
        if (!t) return false;
        return (Date.now() - parseInt(t, 10)) / 86400000 < DISMISS_DAYS;
      } catch (e) { return false; }
    }
    function showBanner(){
      if (shown || isStandalone() || recentlyDismissed()) return;
      shown = true;
      setTimeout(function(){ banner.classList.add('show'); }, 1500);
    }
    function hideBanner(){ banner.classList.remove('show'); }

    dismissB.addEventListener('click', function(){
      hideBanner();
      try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
    });

    // Chrome / Edge / Android
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      installB.style.display = '';
      subEl.textContent = 'Add to your home screen for quick, full-screen access.';
      showBanner();
    });

    installB.addEventListener('click', function(){
      if (deferredPrompt) {
        hideBanner();
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choice){
          if (choice && choice.outcome === 'dismissed') {
            try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
          }
        }).finally(function(){ deferredPrompt = null; });
      } else {
        subEl.textContent = 'Tap the Share icon, then "Add to Home Screen".';
        installB.style.display = 'none';
      }
    });

    window.addEventListener('appinstalled', function(){
      hideBanner();
      deferredPrompt = null;
      try { localStorage.removeItem(DISMISS_KEY); } catch (e) {}
    });

    // iOS Safari has no beforeinstallprompt — show instructions instead
    var ua = window.navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
    var isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
    if (isIOS && isSafari && !isStandalone()) {
      subEl.textContent = 'Tap the Share icon, then "Add to Home Screen".';
      installB.style.display = 'none';
      showBanner();
    }
  })();
</script>
</body>
</html>
